name: Run Market Daily News

on:
  schedule:
    # GitHub Actions cron uses UTC. These are 06:00, 08:00, ..., 22:00 in Vietnam.
    - cron: '0 23 * * *'
    - cron: '0 1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run:
          npm ci

      - name: Build TypeScript
        run:
          npm run build

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_SYMBOLS: ${{ vars.STOCK_SYMBOLS }}
          # Three-hour overlap prevents missed news if a scheduled run starts late.
          NEWS_WINDOW_HOURS: "3"
          # Set the RUN_MODE repository secret to TEST or LIVE.
          RUN_MODE: ${{ secrets.RUN_MODE }}
          LOG_LEVEL: info
        run:
          npm start

      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: execution-logs
          path: logs
          retention-days: 7
          if-no-files-found: ignore
