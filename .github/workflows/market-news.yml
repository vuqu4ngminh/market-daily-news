name: Run Market Daily News

on:
  schedule:
    - cron: '0 23,1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run Mode"
        required: true
        default: "TEST"
        type: choice
        options:
          - TEST
          - LIVE

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run:
          npm ci

      - name: Build TypeScript
        run:
          npm run build

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_SYMBOLS: ${{ vars.STOCK_SYMBOLS }}
          # Three-hour overlap prevents missed news if a scheduled run starts late.
          NEWS_WINDOW_HOURS: ${{ vars.NEWS_WINDOW_HOURS }}
          # Set the RUN_MODE repository secret to TEST or LIVE.
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode || 'LIVE' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        run:
          npm start

      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: execution-logs
          path: logs
          retention-days: 7
          if-no-files-found: ignore
